# Optioneel: nginx als reverse proxy voor het dashboard.
#
#   sudo apt install nginx
#   sudo cp deploy/nginx-goldenknight.conf /etc/nginx/sites-available/goldenknight
#   sudo ln -s /etc/nginx/sites-available/goldenknight /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Wil je https? Gebruik certbot (met een eigen domeinnaam), of maak een
# zelfondertekend certificaat voor thuisgebruik. Zet daarna GK_HTTPS=true
# en GK_TRUST_PROXY=true in .env.

server {
    listen 80;
    server_name goldenknight.local;

    # Uploads van achtergrondfoto's (iets ruimer dan de limiet in de app).
    client_max_body_size 8m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
